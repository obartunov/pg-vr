<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>VR lifecycle graph — VR / jsonb / overlay</title>
<style>
:root {
  --bg:#0d1117; --panel:#161b22; --panel2:#0f141b; --text:#e6edf3; --muted:#8b949e;
  --border:#30363d; --accent:#58a6ff; --green:#3FB950; --eng:#FFD43B; --partial:#FF7B00; --deferred:#7A4B16; --blocker:#F85149;
  --shadow: 0 18px 50px rgba(0,0,0,.35);
}
* { box-sizing: border-box; }
body { margin:0; background:var(--bg); color:var(--text); font:14px/1.35 system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif; overflow:hidden; overscroll-behavior:none; }
body.graphOnly #app { grid-template-columns: 0 1fr 0; }
body.graphOnly .sidebar, body.graphOnly .details { display:none; }
body.graphOnly header { grid-column:1 / 4; }
body.graphOnly .canvasWrap { grid-column:1 / 4; }
body.graphOnly .breadcrumb { left:14px; }
body.graphOnly .zoomTools { right:14px; }
#app { display:grid; grid-template-columns: 310px 1fr 380px; grid-template-rows: 64px 1fr; height:100vh; }
header { grid-column:1 / 4; display:flex; align-items:center; justify-content:space-between; padding:10px 16px; border-bottom:1px solid var(--border); background:linear-gradient(180deg,#161b22,#0f141b); }
.title { display:flex; flex-direction:column; gap:2px; }
.title h1 { margin:0; font-size:18px; letter-spacing:.2px; }
.title small { color:var(--muted); font-size:12px; }
.topStats { display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
.pill { border:1px solid var(--border); background:#0d1117; padding:5px 8px; border-radius:999px; font-size:12px; color:#c9d1d9; }
.pill strong { color:#fff; }
.modeSwitch { display:inline-flex; border:1px solid var(--border); border-radius:999px; overflow:hidden; }
.modeBtn { background:#0d1117; color:#c9d1d9; border:0; padding:6px 14px; font-size:12px; cursor:pointer; font-family:inherit; }
.modeBtn:not(:last-child){ border-right:1px solid var(--border); }
.modeBtn.active { background:var(--accent); color:#0d1117; font-weight:700; }
.sidebar, .details { background:var(--panel); border-right:1px solid var(--border); overflow:auto; }
.details { border-right:0; border-left:1px solid var(--border); padding:14px; }
.sidebar { padding:12px; }
.canvasWrap { position:relative; overflow:hidden; background:radial-gradient(circle at 30% 10%, rgba(88,166,255,.09), transparent 38%), #0d1117; touch-action:none; }
#graphSvg { width:100%; height:100%; display:block; cursor:grab; touch-action:none; -ms-touch-action:none; }
#graphSvg.grabbing { cursor:grabbing; }
button, input { font:inherit; }
input[type="text"] { width:100%; padding:9px 10px; border:1px solid var(--border); border-radius:8px; background:#0d1117; color:var(--text); outline:none; }
input[type="text"]:focus { border-color:var(--accent); box-shadow:0 0 0 2px rgba(88,166,255,.18); }
button { background:#21262d; color:#c9d1d9; border:1px solid var(--border); border-radius:8px; padding:7px 9px; cursor:pointer; }
button:hover { border-color:#8b949e; color:#fff; }
.btnrow { display:flex; gap:8px; flex-wrap:wrap; margin:10px 0; }
.section { margin:14px 0; }
.section h3 { margin:0 0 8px; font-size:12px; text-transform:uppercase; letter-spacing:.08em; color:#8b949e; }
.check { display:flex; gap:8px; align-items:center; margin:6px 0; color:#c9d1d9; }
.check input { accent-color:var(--accent); }
.legendRow { display:flex; align-items:center; justify-content:space-between; border:1px solid var(--border); border-radius:8px; padding:7px; margin:6px 0; background:#0d1117; }
.swatch { width:14px; height:14px; border-radius:4px; display:inline-block; margin-right:8px; border:1px solid rgba(255,255,255,.25); }
.groupList button { display:block; width:100%; text-align:left; margin:6px 0; padding:8px; }
.groupList button.active { border-color:var(--accent); background:rgba(88,166,255,.12); }
.breadcrumb { position:absolute; left:14px; top:12px; display:flex; gap:7px; align-items:center; z-index:4; background:rgba(13,17,23,.88); border:1px solid var(--border); border-radius:10px; padding:8px 10px; backdrop-filter: blur(8px); box-shadow:var(--shadow); }
.breadcrumb span { color:#c9d1d9; }
.breadcrumb .crumb { color:#fff; font-weight:600; }
.zoomTools { position:absolute; right:14px; top:12px; display:flex; gap:6px; z-index:4; background:rgba(13,17,23,.88); border:1px solid var(--border); border-radius:10px; padding:6px; }
/* Minimap removed in v3: it occupied visual space without adding semantic value. */
.tooltip { position:fixed; z-index:20; pointer-events:none; max-width:390px; background:#010409; color:#e6edf3; border:1px solid var(--border); border-radius:10px; padding:10px 11px; box-shadow:var(--shadow); display:none; font-size:12px; }
.tooltip b { font-size:13px; color:#fff; }
.tooltip .muted { color:#8b949e; margin-top:3px; }
.node rect, .groupNode rect { filter: drop-shadow(0 10px 16px rgba(0,0,0,.35)); }
.node text, .groupNode text { pointer-events:none; user-select:none; }
.inherited { opacity:.42; }
.inherited:hover { opacity:.85; }
.typeNative rect { filter: drop-shadow(0 0 10px rgba(163,113,247,.45)); }
.inheritedEdge { opacity:.3; }
.inheritedEdge:hover { opacity:.8; }
.edgePath { fill:none; stroke-width:2.4; opacity:.82; cursor:pointer; }
.edgePath:hover { stroke-width:4.2; opacity:1; }
.edgeHandle { cursor:pointer; }
.edgeDot { transition:r .1s; }
.edgeHandle:hover .edgeDot { r:12; }
.edgeDotCount { font-size:9px; font-weight:700; font-family:ui-monospace,Menlo,monospace; pointer-events:none; }
.ttfiles { font-family:ui-monospace,Menlo,monospace; font-size:11px; color:#9fd0c8; margin-top:4px; }
.edgeLabel { font-size:11px; fill:#e6edf3; paint-order:stroke; stroke:#0d1117; stroke-width:4px; stroke-linejoin:round; pointer-events:none; font-weight:700; }
.edgeKindLabel { font-size:9.5px; paint-order:stroke; stroke:#0d1117; stroke-width:4px; stroke-linejoin:round; pointer-events:none; text-transform:uppercase; letter-spacing:.03em; }
.nodeBadge { font-size:9px; font-weight:700; fill:#0d1117; }
.details h2 { margin:2px 0 4px; font-size:18px; }
.details .idline { color:#8b949e; margin-bottom:12px; }
.details .statusLine { display:flex; align-items:center; gap:8px; margin:8px 0 14px; }
.kv { margin:10px 0; padding:10px; background:#0d1117; border:1px solid var(--border); border-radius:10px; }
.kv h4 { margin:0 0 6px; color:#c9d1d9; font-size:12px; text-transform:uppercase; letter-spacing:.06em; }
.kv p { margin:0; color:#d1d9e0; white-space:pre-wrap; }
.tag { display:inline-block; margin:3px 4px 3px 0; padding:4px 6px; border-radius:7px; border:1px solid var(--border); background:#161b22; color:#c9d1d9; font-size:12px; }
.searchHit { outline:3px solid #58a6ff; outline-offset:3px; }
.smallNote { color:#8b949e; font-size:12px; margin:6px 0; }
hr { border:0; border-top:1px solid var(--border); margin:14px 0; }
@media (max-width: 1100px) { #app { grid-template-columns:260px 1fr; } .details { display:none; } header { grid-column:1 / 3; } body.graphOnly #app { grid-template-columns:1fr; } body.graphOnly header { grid-column:1 / 2; } body.graphOnly .canvasWrap { grid-column:1 / 2; } }
@media (max-width: 760px) { #app { grid-template-columns:1fr; grid-template-rows:58px auto 1fr; } header { grid-column:1; } .sidebar { grid-column:1; max-height:210px; border-right:0; border-bottom:1px solid var(--border); } .canvasWrap { grid-column:1; } body.graphOnly #app { grid-template-rows:58px 1fr; } body.graphOnly .sidebar { display:none; } .topStats .pill:nth-child(3) { display:none; } .title h1 { font-size:15px; } .breadcrumb { max-width:60vw; overflow:hidden; } .zoomTools { flex-wrap:wrap; justify-content:flex-end; max-width:45vw; } }
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="title">
      <h1 id="graphTitle">VR Lifecycle Graph <span id="rev"></span></h1>
      <small id="subtitle"></small>
    </div>
    <div class="topStats">
      <div class="modeSwitch" id="modeSwitch">
        <button data-mode="vr" class="modeBtn active">VR</button>
        <button data-mode="jsonb" class="modeBtn">jsonb</button>
        <button data-mode="overlay" class="modeBtn">overlay</button>
      </div>
      <span class="pill">Verdict: <strong id="verdict"></strong></span>
      <span class="pill">Blockers: <strong id="blockers"></strong></span>
      <span class="pill">Tip tree: <strong id="tipTree"></strong></span>
    </div>
  </header>

  <aside class="sidebar">
    <input id="search" type="text" placeholder="Search: E25, REPACK, pg_upgrade, proto.c…" />
    <div class="btnrow">
      <button id="fitBtn">Fit</button>
      <button id="overviewBtn">Overview</button>
      <button id="exportBtn">Export SVG</button>
    </div>
    <div class="section">
      <h3>Status filters</h3>
      <div id="statusFilters"></div>
    </div>
    <div class="section">
      <h3>Legend</h3>
      <div id="legend"></div>
      <div class="smallNote">Refused-by-design is green/pass with a REFUSED badge, not red.</div>
    </div>
    <div class="section">
      <h3>Edge semantics</h3>
      <div id="edgeLegend"></div>
      <div class="smallNote">Edge color shows transition kind. Edge dash/badge shows readiness/status.</div>
    </div>
    <div class="section groupList">
      <h3>Hierarchy</h3>
      <div id="groupButtons"></div>
    </div>
  </aside>

  <main class="canvasWrap">
    <div class="breadcrumb"><button id="upBtn">Up</button><span>VR v0</span><span>›</span><span class="crumb" id="crumb">Overview</span></div>
    <div class="zoomTools"><button id="focusBtn">Graph only</button><button id="zoomIn">＋</button><button id="zoomOut">−</button><button id="resetZoom">Reset</button></div>
    <svg id="graphSvg"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#8b949e"/></marker></defs><g id="viewport"></g></svg>
  </main>

  <aside class="details" id="details"></aside>
</div>
<div class="tooltip" id="tooltip"></div>

function renderDetail(){

  edges.forEach(e=>{ if(!ids.has(e.from)){ nodes.push(nodeById(e.from)); ids.add(e.from);} if(!ids.has(e.to)){ nodes.push(nodeById(e.to)); ids.add(e.to);} });

        status: gstatus,

  if(e.ctrlKey){
    // trackpad pinch (and Ctrl+wheel) -> zoom at cursor
    const p=svgPointFromClient(e.clientX,e.clientY);
    const f=Math.exp(-e.deltaY*0.01);
    zoom(f,p.x,p.y);
  } else {
    // two-finger scroll (and mouse wheel) -> pan
    tx -= e.deltaX; ty -= e.deltaY; setTransform();
  }
},{passive:false});
svg.addEventListener('mousedown',e=>{ dragging=true; dragStart={x:e.clientX,y:e.clientY,tx,ty}; svg.classList.add('grabbing'); });
window.addEventListener('mousemove',e=>{ if(dragging){ tx=dragStart.tx+(e.clientX-dragStart.x); ty=dragStart.ty+(e.clientY-dragStart.y); setTransform(); }});
window.addEventListener('mouseup',()=>{ dragging=false; svg.classList.remove('grabbing'); });

let touchMode = null;
let touchState = null;
function touchDistance(t1,t2){ return Math.hypot(t2.clientX-t1.clientX, t2.clientY-t1.clientY); }
function touchMidpoint(t1,t2){ const p1=svgPointFromClient(t1.clientX,t1.clientY), p2=svgPointFromClient(t2.clientX,t2.clientY); return {x:(p1.x+p2.x)/2, y:(p1.y+p2.y)/2}; }
svg.addEventListener('touchstart', e=>{
  if(e.touches.length===1){
    const t=e.touches[0]; touchMode='pan'; touchState={x:t.clientX,y:t.clientY,tx,ty}; svg.classList.add('grabbing');
  } else if(e.touches.length>=2){
    e.preventDefault();
    const [t1,t2]=e.touches; const mid=touchMidpoint(t1,t2);
    touchMode='pinch';
    touchState={dist:touchDistance(t1,t2), mid, scale, tx, ty, wx:(mid.x-tx)/scale, wy:(mid.y-ty)/scale};
    svg.classList.add('grabbing');
  }
},{passive:false});
svg.addEventListener('touchmove', e=>{
  if(!touchMode || !touchState) return;
  e.preventDefault();
  if(touchMode==='pan' && e.touches.length===1){
    const t=e.touches[0]; tx=touchState.tx+(t.clientX-touchState.x); ty=touchState.ty+(t.clientY-touchState.y); setTransform();
  } else if(e.touches.length>=2){
    const [t1,t2]=e.touches; const mid=touchMidpoint(t1,t2);
    const nextScale=Math.max(.18, Math.min(2.8, touchState.scale * (touchDistance(t1,t2)/touchState.dist)));
    scale=nextScale; tx=mid.x - touchState.wx*scale; ty=mid.y - touchState.wy*scale; setTransform();
  }
},{passive:false});
svg.addEventListener('touchend', e=>{
  if(e.touches.length===0){ touchMode=null; touchState=null; svg.classList.remove('grabbing'); }
  else if(e.touches.length===1){ const t=e.touches[0]; touchMode='pan'; touchState={x:t.clientX,y:t.clientY,tx,ty}; }
},{passive:false});
svg.addEventListener('touchcancel',()=>{ touchMode=null; touchState=null; svg.classList.remove('grabbing'); },{passive:false});

svg.addEventListener('click',()=>{ if(selected){} });
document.getElementById('search').addEventListener('input',e=>{ search=e.target.value.trim(); render(); });
document.getElementById('fitBtn').onclick=fitToContent;
document.getElementById('overviewBtn').onclick=()=>{currentGroup='Overview'; render();};
document.getElementById('upBtn').onclick=()=>{currentGroup='Overview'; render();};
document.getElementById('zoomIn').onclick=()=>zoom(1.2);
document.getElementById('zoomOut').onclick=()=>zoom(.83);
document.getElementById('resetZoom').onclick=resetTransform;
document.getElementById('focusBtn').onclick=()=>{ document.body.classList.toggle('graphOnly'); document.getElementById('focusBtn').textContent=document.body.classList.contains('graphOnly')?'Panels':'Graph only'; setTimeout(fitToContent, 40); };
document.getElementById('exportBtn').onclick=exportSvg;
window.addEventListener('resize',()=>fitToContent());
document.getElementById('modeSwitch').addEventListener('click',e=>{
  const b=e.target.closest('.modeBtn'); if(!b) return;
  currentMode=b.dataset.mode; currentGroup='Overview';
  document.querySelectorAll('.modeBtn').forEach(x=>x.classList.toggle('active', x===b));
  const gt=document.getElementById('graphTitle');
  if(gt) gt.firstChild.textContent=(currentMode==='jsonb'?DATA.meta.jsonbTitle:(currentMode==='overlay'?'VR + jsonb overlay':DATA.meta.title))+' ';
  const sub=document.getElementById('subtitle');
  if(sub) sub.textContent = currentMode==='overlay'
    ? 'dim = inherited from VR · bright (purple glow) = jsonb-native · dashed purple = derives-from'
    : `${DATA.meta.sourceDocs.join(' + ')} · tip ${DATA.meta.tipCommit.slice(0,8)}`;
  render();
});
initSidebar(); render();
</script>
</body>
